# Mapa "Desert"
# Cada [[tileset]] reserva un rango de IDs globales empezando en firstgid.
# Cada [[layer]].data es una matriz [height][width] con esos IDs (0 = vacio).
# Los paths son relativos a este archivo.

tile_size = 64
width  = 29
height = 16

# ── Tilesets ────────────────────────────────────────────────────────────────
# IDs reservados:
#   sand:      1
#   water:     2
#   buildings: 3 .. 258
[[tileset]]
name = "sand"
file = "sand.png"
columns = 1
tile_count = 1
firstgid = 1

[[tileset]]
name = "water"
file = "water.png"
columns = 1
tile_count = 1
firstgid = 2
collidable = true

[[tileset]]
name = "buildings"
file = "buildings.png"
columns = 16
tile_count = 256
firstgid = 3
collidable = true


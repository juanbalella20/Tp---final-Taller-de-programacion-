# Mapa "City"
# Cada [[tileset]] reserva un rango de IDs globales empezando en firstgid.
# Cada [[layer]].data es una matriz [height][width] con esos IDs (0 = vacio).
# Los paths son relativos a este archivo.
# logical width/height representan píxeles del mundo visibles por pantalla" (que equivale a tiles_visibles × tile_size)
# en este caso tiles visibles = 15x9 = 960x576

logical_width = 960
logical_height = 576
tile_size = 64
width  = 30
height = 16

# ── Tilesets ────────────────────────────────────────────────────────────────
# IDs reservados:
#   grass:  1 .. 256
#   portal: 257  (collidable; reusa el mismo PNG, solo importa el flag)
[[tileset]]
name = "grass"
file = "5108.png"
columns = 16
tile_count = 256
firstgid = 1

[[tileset]]
name = "portal"
file = "5108.png"
columns = 16
tile_count = 1
firstgid = 257
collidable = true

# ── Capas (se dibujan en orden: la primera atras, la ultima adelante) ───────


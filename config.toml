# vida/mana maxima (0.01 = 1% por segundo). La aplica el game loop.
life_regen_per_second = 0.01
mana_regen_per_second = 0.01

# Inventario inicial de cada nuevo jugador: lista de ids de items (deben
# coincidir con las claves de [items.*] de arriba; "escudo" es alias de
# "escudo_tortuga"). Cambiar esta lista cambia el equipamiento de arranque
# sin recompilar. Si se deja vacia se usa el equipamiento por defecto.
initial_inventory = ["espada", "escudo_hierro", "vara_fresno", "baculo_nudoso",
                     "baculo_engarzado", "flauta_elfica", "arco_simple",
                     "arco_compuesto","martillo"]

# Cantidad maxima (N) de items que puede tener el inventario de cualquier
# jugador. Al llegar al tope, add_item lo rechaza (los items quedan en el piso).
max_inventory_slots = 16


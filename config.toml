# Al morir un NPC SIEMPRE deja caer oro base (seccion "Oro" del enunciado):
#   OroBase = rand(0, npc_gold_drop_max) * VidaMaxNPC
# y ADEMAS se sortea un drop extra segun esta tabla (seccion "Criaturas").
# Se sortea r en [0,1) y, segun en que franja acumulada caiga, deja caer:
#   [0, prob_nothing)                 -> nada extra
#   [prob_nothing, +prob_gold)        -> oro extra: rand(npc_gold_drop_min, npc_gold_drop_max) * VidaMaxNPC
#   [..., +prob_potion)               -> una pocion (vida/mana) al azar
#   [..., +prob_item)                 -> cualquier otro objeto al azar
#   el resto (1 - la suma de las 4)   -> nada extra
# La suma de las 4 puede ser < 1; el sobrante cuenta como "nada extra".
[npcs.drop]
prob_nothing = 0.80
prob_gold = 0.08
prob_potion = 0.01
prob_item = 0.01

# Rango del factor de oro (base y extra): rand(min, max) * VidaMaxNPC.
# El oro base usa rand(0, npc_gold_drop_max); el extra usa rand(min, max).
npc_gold_drop_min = 0.01
npc_gold_drop_max = 0.2

# ------------------------------------------------------------
# Zonas: tipos de NPC permitidos por zona
# (coinciden con las claves de npcs)
# ------------------------------------------------------------
# map: ruta al .bin de la zona. La cargan TANTO el servidor (colision/teleports/
# estado) como el cliente (render). Deben ser la misma para que ambos lados vean
# el mismo mapa. La ruta es relativa al cwd (raiz del repo).
# num_items: cuantos items caen al piso en la zona al iniciar.
# allowed_items: de que items se sortean esos num_items (ids de [items.*]).
#   Si se omite o queda vacio, se usa el pool global (todos los dropeables).
# safe_zone: true = zona segura, sin PvP (ningun player puede dañar a otro,
#   sean o no del mismo clan). Si se omite, false.
[zones.desert]
# map = "data/maps/desert/map-2.bin"
map = "data/maps/desert/desert-v4.bin"
allowed_npcs = ["goblin", "spider"]
num_npc = 7
# Pool ampliado para probar la impresión de los items que no aparecían en otras
# zonas (arcos y escudo de tortuga). num_items alto para que caigan varios.
num_items = 10
allowed_items = ["espada", "hacha", "armadura_cuero", "capucha", "pocion_vida",
                 "arco_simple", "arco_compuesto", "escudo_tortuga"]

[zones.city]
# map = "data/maps/city/city-2.bin"
map = "data/maps/city/city-v2.bin" 
safe_zone = true
num_items = 5
allowed_items = ["pocion_vida", "pocion_mana"]
# Cantidad de NPCs amigos en celdas random (ademas de los nombrados en el .bin).
num_priests = 1
num_npc = 0
num_sellers = 1
num_bankers = 1

[zones.forest]
#map = "data/maps/forest/forest3.bin"
map = "data/maps/forest/forest-v5.bin"
allowed_npcs = ["orc"]
num_npc = 3
num_items = 5
allowed_items = ["vara_fresno", "baculo_nudoso", "tunica_azul", "sombrero_magico", "pocion_mana"]

[zones.dungeon]
map = "data/maps/dungeon/dungeon-v1.bin"
#map = "data/maps/dungeon/dungeo-v2.bin"
allowed_npcs = ["skeleton3", "zombie", "orc", "golem2", "spider3"]
num_npc = 12
num_items = 8
allowed_items = ["baculo_engarzado", "martillo", "armadura_placas", "casco_hierro", "escudo_hierro", "pocion_vida", "pocion_mana"]

 
